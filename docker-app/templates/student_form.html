<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #334155;
            width: 320px;
        }
        input {
            margin: 10px 0;
            padding: 10px;
            width: 90%;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Add Student</h2>
        <form method="POST" action="/api/students">
            <input type="text" name="name" placeholder="Student Name" required><br>
            <input type="number" name="age" placeholder="Student Age" required><br>
            <button type="submit">Save Student</button>
        </form>
    </div>
</body>
</html>
